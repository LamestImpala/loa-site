name: Daily Discogs price run

on:
  schedule:
    - cron: "0 13 * * *" # 6:00 AM Arizona (UTC-7, no DST)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  price-run:
    runs-on: ubuntu-latest
    timeout-minutes: 50 # two Discogs calls per record at 60 req/min
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/price-run.mjs
        env:
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      - name: Open an issue if the run failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Daily price run failed ($(date -u +%F))" \
            --body "The Discogs price run failed. Prices may be stale until this is fixed. Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
